# === EDUBUZZ PRODUCTION NGINX CONFIG ===
# Security-hardened with HSTS, anti-bot, and rate limiting

limit_req_zone $binary_remote_addr zone=api:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;

# Anti-bot: block known malicious user agents
map $http_user_agent $block_ua {
    default 0;
    "~*MJ12bot" 1;
    "~*AhrefsBot" 1;
    "~*SemrushBot" 1;
    "~*DotBot" 1;
    "~*Bytespider" 1;
    "~*PetalBot" 1;
    "~*Barkrowler" 1;
    "~*DataForSeoBot" 1;
    "~*SeznamBot" 1;
    "~*zgrab" 1;
    "~*masscan" 1;
    "~*nmap" 1;
    "~*goby" 1;
    "~*sqlmap" 1;
    "~*nikto" 1;
    "~*wpscan" 1;
    "~*censys" 1;
    "~*shodan" 1;
}

server {
    listen 80;
    server_name edubuzz.co.za www.edubuzz.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edubuzz.co.za www.edubuzz.co.za;

    ssl_certificate     /etc/letsencrypt/live/edubuzz.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edubuzz.co.za/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS: max-age 1 year, include subdomains, preload-ready
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml application/atom+xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # Hidden files / sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* (\.env|composer\.json|wp-config\.php|\.git) {
        deny all;
        return 404;
    }

    # PHP files — block (no PHP on this server)
    location ~* \.php$ {
        deny all;
        return 404;
    }

    # Anti-bot blocking
    if ($block_ua) {
        return 444;
    }

    # Block blank/missing user agents (aggressive scanners)
    if ($http_user_agent = "") {
        return 444;
    }

    # Block common exploit paths
    location ~* (wp-admin|wp-login|xmlrpc\.php|wp-content|administrator) {
        return 444;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # CSP: unsafe-inline required for Astro inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://pagead2.googlesyndication.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Rate limit Astro API routes
    location /api/apply {
        limit_req zone=upload burst=2 nodelay;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=login burst=2 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets served from filesystem
    location ~* \.(js|css|woff2|webp|png|jpg|ico|svg)$ {
        root /home/edubuzz/edubuzz/dist/client;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @node;
    }

    # XML sitemaps and feeds — cache 1 hour
    location ~* \.(xml|rss|atom)$ {
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Robots.txt and llms.txt — cache 24h
    location ~* /(robots\.txt|llms\.txt)$ {
        add_header Cache-Control "public, max-age=86400";
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @node {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300, stale-if-error=86400";
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
