# /etc/nginx/sites-available/edubuzz
# Symlink: ln -s /etc/nginx/sites-available/edubuzz /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name edubuzz.co.za www.edubuzz.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name edubuzz.co.za www.edubuzz.co.za;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/edubuzz.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edubuzz.co.za/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # PocketBase admin + API (/_/ and /pb/)
    location /_/ {
        proxy_pass         http://127.0.0.1:8090/_/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/collections/ {
        proxy_pass         http://127.0.0.1:8090/api/collections/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Astro frontend — everything else
    location / {
        proxy_pass         http://127.0.0.1:4321;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
