# /etc/nginx/sites-available/edubuzz

limit_req_zone $binary_remote_addr zone=api:10m rate=5r/m;

server {
    listen 80;
    server_name edubuzz.co.za www.edubuzz.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name edubuzz.co.za www.edubuzz.co.za;

    ssl_certificate     /etc/letsencrypt/live/edubuzz.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edubuzz.co.za/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://www.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|woff2|webp|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass         http://127.0.0.1:4321;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /_/ {
        proxy_pass         http://127.0.0.1:8090/_/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/collections/ {
        limit_req zone=api burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8090/api/collections/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api burst=3 nodelay;
        proxy_pass         http://127.0.0.1:4321;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
        proxy_pass         http://127.0.0.1:4321;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
